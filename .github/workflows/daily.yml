name: 데일리 브리핑 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 22:00 전날)
    - cron: "0 22 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 페이지 생성
        run: python build.py

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "브리핑 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            git push
          fi
